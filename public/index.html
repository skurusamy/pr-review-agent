<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>pr-review-agent</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 640px;
        margin: 3rem auto;
        padding: 0 1rem;
        color: #1a1a1a;
      }
      h1 {
        font-size: 1.25rem;
      }
      label {
        display: block;
        margin-top: 1rem;
        font-weight: 600;
      }
      input[type="text"] {
        width: 100%;
        padding: 0.5rem;
        font-size: 1rem;
        box-sizing: border-box;
      }
      .checkbox-row {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-top: 1rem;
        font-weight: normal;
      }
      button {
        margin-top: 1.5rem;
        padding: 0.6rem 1.2rem;
        font-size: 1rem;
        cursor: pointer;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.6;
      }
      #output {
        background: #111;
        color: #d1d5db;
        padding: 1rem;
        border-radius: 6px;
        margin-top: 1.5rem;
        max-height: 60vh;
        overflow-y: auto;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.85rem;
        line-height: 1.5;
      }
      .log-line {
        white-space: pre-wrap;
        word-break: break-word;
      }
      .log-thinking {
        color: #7dd3fc;
        font-style: italic;
        opacity: 0.85;
      }
      .log-tool {
        color: #60a5fa;
      }
      .log-verdict-bug {
        color: #f87171;
        font-weight: 600;
      }
      .log-verdict-not-bug {
        color: #4ade80;
      }
      .log-section {
        color: #f3f4f6;
        font-weight: 700;
        margin-top: 0.75rem;
        padding-top: 0.5rem;
        border-top: 1px solid #333;
      }
      .log-success {
        color: #4ade80;
        font-weight: 600;
      }
      .log-warn {
        color: #fbbf24;
      }
      .log-error {
        color: #f87171;
        font-weight: 700;
      }
      .log-info {
        color: #9ca3af;
      }
      .error {
        color: #b00020;
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <h1>pr-review-agent</h1>
    <form id="review-form">
      <label for="prUrl">Pull request link</label>
      <input
        type="text"
        id="prUrl"
        name="prUrl"
        placeholder="https://github.com/owner/repo/pull/123"
        required
      />

      <label class="checkbox-row">
        <input type="checkbox" id="dryRun" name="dryRun" checked />
        Dry run (compute everything, but don't push or write to GitHub)
      </label>

      <button type="submit" id="submit-button">Run review</button>
    </form>

    <div id="error" class="error" hidden></div>
    <div id="output" hidden></div>

    <script>
      const form = document.getElementById("review-form");
      const submitButton = document.getElementById("submit-button");
      const output = document.getElementById("output");
      const errorBox = document.getElementById("error");

      function appendLine(kind, text) {
        if (!text) return;
        const line = document.createElement("div");
        line.className = `log-line log-${kind}`;
        line.textContent = text;
        output.appendChild(line);
        output.scrollTop = output.scrollHeight;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        submitButton.disabled = true;
        submitButton.textContent = "Running...";
        errorBox.hidden = true;
        output.textContent = "";
        output.hidden = false;

        const prUrl = document.getElementById("prUrl").value;
        const dryRun = document.getElementById("dryRun").checked;

        try {
          const response = await fetch("/review", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prUrl, dryRun }),
          });

          if (!response.ok || !response.body) {
            const data = await response.json().catch(() => ({}));
            errorBox.textContent =
              data.error ?? `Request failed (${response.status})`;
            errorBox.hidden = false;
            return;
          }

          // The response body is streamed as newline-delimited JSON, one
          // object per log line -- read it as it arrives instead of
          // waiting for the whole run (which can take a couple of minutes)
          // to finish, so progress shows up live.
          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let buffer = "";

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split("\n");
            buffer = lines.pop() ?? "";
            for (const raw of lines) {
              if (!raw) continue;
              const entry = JSON.parse(raw);
              if (entry.kind === "done") continue;
              if (entry.kind === "error") {
                errorBox.textContent = entry.text;
                errorBox.hidden = false;
                continue;
              }
              appendLine(entry.kind, entry.text);
            }
          }
        } catch (err) {
          errorBox.textContent =
            err instanceof Error ? err.message : String(err);
          errorBox.hidden = false;
        } finally {
          submitButton.disabled = false;
          submitButton.textContent = "Run review";
        }
      });
    </script>
  </body>
</html>
