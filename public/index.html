<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pr-review-agent</title>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/log.css" />
    <link rel="stylesheet" href="css/briefing.css" />
    <link rel="stylesheet" href="css/results.css" />
    <link rel="stylesheet" href="css/history.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <h1>pr-review-agent</h1>
    <form id="fix-form">
      <label for="prUrl">Pull request link</label>
      <input
        type="text"
        id="prUrl"
        name="prUrl"
        placeholder="https://github.com/owner/repo/pull/123"
        required
      />

      <label class="checkbox-row">
        <input type="checkbox" id="dryRun" name="dryRun" checked />
        Dry run (compute everything, but don't push or write to GitHub)
      </label>

      <div class="button-row">
        <button type="submit" id="submit-button">Fix comments</button>
        <button type="button" id="brief-button" class="secondary">
          Generate PR Briefing
        </button>
        <button type="button" id="stop-button" class="stop" hidden>
          <span class="stop-icon"></span>Stop
        </button>
      </div>
    </form>

    <details id="history">
      <summary>History (<span id="history-count">0</span>)</summary>
      <input
        type="text"
        id="history-filter"
        placeholder="Filter by repo or PR number"
        aria-label="Filter history"
      />
      <div id="history-list"></div>
    </details>

    <div id="error" class="error" hidden></div>
    <div id="results-tabs" role="tablist" hidden>
      <button type="button" role="tab" data-tab="summary" class="on">
        Summary
      </button>
      <button type="button" role="tab" data-tab="log">Raw log</button>
    </div>
    <div id="results-summary" hidden></div>
    <div id="output" hidden></div>
    <div id="briefing" hidden></div>
  </body>
</html>
