<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>pr-review-agent</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 640px;
        margin: 3rem auto;
        padding: 0 1rem;
        color: #1a1a1a;
      }
      h1 {
        font-size: 1.25rem;
      }
      label {
        display: block;
        margin-top: 1rem;
        font-weight: 600;
      }
      input[type="text"] {
        width: 100%;
        padding: 0.5rem;
        font-size: 1rem;
        box-sizing: border-box;
      }
      .checkbox-row {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-top: 1rem;
        font-weight: normal;
      }
      button {
        margin-top: 1.5rem;
        padding: 0.6rem 1.2rem;
        font-size: 1rem;
        cursor: pointer;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.6;
      }
      pre {
        background: #111;
        color: #eee;
        padding: 1rem;
        border-radius: 6px;
        white-space: pre-wrap;
        margin-top: 1.5rem;
        max-height: 60vh;
        overflow-y: auto;
      }
      .error {
        color: #b00020;
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <h1>pr-review-agent</h1>
    <form id="review-form">
      <label for="prUrl">Pull request link</label>
      <input
        type="text"
        id="prUrl"
        name="prUrl"
        placeholder="https://github.com/owner/repo/pull/123"
        required
      />

      <label class="checkbox-row">
        <input type="checkbox" id="dryRun" name="dryRun" checked />
        Dry run (compute everything, but don't push or write to GitHub)
      </label>

      <button type="submit" id="submit-button">Run review</button>
    </form>

    <div id="error" class="error" hidden></div>
    <pre id="output" hidden></pre>

    <script>
      const form = document.getElementById("review-form");
      const submitButton = document.getElementById("submit-button");
      const output = document.getElementById("output");
      const errorBox = document.getElementById("error");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        submitButton.disabled = true;
        submitButton.textContent = "Running...";
        errorBox.hidden = true;
        output.hidden = true;

        const prUrl = document.getElementById("prUrl").value;
        const dryRun = document.getElementById("dryRun").checked;

        try {
          const response = await fetch("/review", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prUrl, dryRun }),
          });
          const data = await response.json();

          if (data.log) {
            output.textContent = data.log;
            output.hidden = false;
          }
          if (!response.ok) {
            errorBox.textContent =
              data.error ?? `Request failed (${response.status})`;
            errorBox.hidden = false;
          }
        } catch (err) {
          errorBox.textContent =
            err instanceof Error ? err.message : String(err);
          errorBox.hidden = false;
        } finally {
          submitButton.disabled = false;
          submitButton.textContent = "Run review";
        }
      });
    </script>
  </body>
</html>
