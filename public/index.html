<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>pr-review-agent</title>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 640px;
        margin: 3rem auto;
        padding: 0 1rem;
        color: #1a1a1a;
      }
      h1 {
        font-size: 1.25rem;
      }
      label {
        display: block;
        margin-top: 1rem;
        font-weight: 600;
      }
      input[type="text"] {
        width: 100%;
        padding: 0.5rem;
        font-size: 1rem;
        box-sizing: border-box;
      }
      .checkbox-row {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-top: 1rem;
        font-weight: normal;
      }
      .button-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 1.5rem;
      }
      button {
        padding: 0.6rem 1.2rem;
        font-size: 1rem;
        cursor: pointer;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.6;
      }
      button.secondary {
        background: #fff;
        border: 1px solid #999;
      }
      button.stop {
        background: #dc2626;
        color: #fff;
        border: 1px solid #b91c1c;
        display: inline-flex;
        align-items: center;
        gap: 0.4em;
      }
      button.stop .stop-icon {
        width: 0.7em;
        height: 0.7em;
        background: #fff;
        border-radius: 2px;
        display: inline-block;
      }
      #stop-button[hidden] {
        display: none;
      }
      #output {
        background: #111;
        color: #d1d5db;
        padding: 1rem;
        border-radius: 6px;
        margin-top: 1.5rem;
        max-height: 60vh;
        overflow-y: auto;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.85rem;
        line-height: 1.5;
      }
      .log-line {
        white-space: pre-wrap;
        word-break: break-word;
      }
      .log-thinking {
        color: #7dd3fc;
        font-style: italic;
        opacity: 0.85;
      }
      .log-tool {
        color: #60a5fa;
      }
      .log-verdict-bug {
        color: #f87171;
        font-weight: 600;
      }
      .log-verdict-not-bug {
        color: #4ade80;
      }
      .log-section {
        color: #f3f4f6;
        font-weight: 700;
        margin-top: 0.75rem;
        padding-top: 0.5rem;
        border-top: 1px solid #333;
      }
      .log-success {
        color: #4ade80;
        font-weight: 600;
      }
      .log-warn {
        color: #fbbf24;
      }
      .log-error {
        color: #f87171;
        font-weight: 700;
      }
      .log-info {
        color: #9ca3af;
      }
      .error {
        color: #b00020;
        margin-top: 1rem;
      }
      #briefing-actions {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-top: 1rem;
      }
      /* An ID selector's display:flex above beats the browser's own
         [hidden] { display: none } (an attribute selector loses that
         specificity fight), so the panel would stay visible even while
         `hidden` is set unless this rule wins the tie back. */
      #briefing-actions[hidden] {
        display: none;
      }
      #post-status {
        font-size: 0.9rem;
        color: #444;
      }
      #briefing {
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 6px;
        padding: 1rem 1.25rem;
        margin-top: 1rem;
        line-height: 1.55;
      }
      #briefing h2 {
        font-size: 1.1rem;
        margin: 0 0 0.5rem;
      }
      #briefing h3 {
        font-size: 1rem;
        margin: 1.25rem 0 0.4rem;
      }
      #briefing p {
        margin: 0.5rem 0;
      }
      #briefing ul {
        margin: 0.4rem 0;
        padding-left: 1.25rem;
      }
      #briefing pre {
        background: #f5f5f5;
        padding: 0.75rem;
        border-radius: 4px;
        overflow-x: auto;
        font-size: 0.85rem;
        margin: 0.5rem 0;
      }
      #briefing code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.9em;
        background: #f5f5f5;
        padding: 0 0.25em;
        border-radius: 3px;
      }
      #briefing pre code {
        background: none;
        padding: 0;
      }
      #briefing .diagram {
        overflow-x: auto;
        margin: 0.5rem 0;
      }
      #briefing .diagram svg {
        max-width: 100%;
      }
    </style>
  </head>
  <body>
    <h1>pr-review-agent</h1>
    <form id="review-form">
      <label for="prUrl">Pull request link</label>
      <input
        type="text"
        id="prUrl"
        name="prUrl"
        placeholder="https://github.com/owner/repo/pull/123"
        required
      />

      <label class="checkbox-row">
        <input type="checkbox" id="dryRun" name="dryRun" checked />
        Dry run (compute everything, but don't push or write to GitHub)
      </label>

      <div class="button-row">
        <button type="submit" id="submit-button">
          Address review comments
        </button>
        <button type="button" id="brief-button" class="secondary">
          Generate PR Briefing
        </button>
        <button type="button" id="stop-button" class="stop" hidden>
          <span class="stop-icon"></span>Stop
        </button>
      </div>
    </form>

    <div id="error" class="error" hidden></div>
    <div id="output" hidden></div>
    <div id="briefing" hidden></div>

    <div id="briefing-actions" hidden>
      <button type="button" id="download-button" class="secondary">
        Download .md
      </button>
      <button type="button" id="post-button" class="secondary">
        Post to GitHub
      </button>
      <span id="post-status"></span>
    </div>

    <script>
      const form = document.getElementById("review-form");
      const submitButton = document.getElementById("submit-button");
      const briefButton = document.getElementById("brief-button");
      const stopButton = document.getElementById("stop-button");
      const output = document.getElementById("output");
      const errorBox = document.getElementById("error");
      const briefingBox = document.getElementById("briefing");
      const briefingActions = document.getElementById("briefing-actions");
      const downloadButton = document.getElementById("download-button");
      const postButton = document.getElementById("post-button");
      const postStatus = document.getElementById("post-status");
      const prUrlInput = document.getElementById("prUrl");
      const dryRunInput = document.getElementById("dryRun");

      mermaid.initialize({ startOnLoad: false, theme: "default" });

      // The one PR Briefing currently on screen -- what "Download .md" and
      // "Post to GitHub" act on. Generating a new Briefing (or running a
      // review) clears it, since posting a stale one for a different PR
      // would be a real bug, not just a stale UI.
      let currentBriefing = null;

      // The in-flight request's own controller, if any -- what the Stop
      // button aborts. Aborting the fetch also closes the connection to the
      // server, which (see server.ts) aborts the underlying Claude Agent SDK
      // session too, so Stop actually halts the work instead of just hiding it.
      let activeController = null;

      function appendLine(kind, text) {
        if (!text) return;
        output.hidden = false;
        const line = document.createElement("div");
        line.className = `log-line log-${kind}`;
        line.textContent = text;
        output.appendChild(line);
        output.scrollTop = output.scrollHeight;
      }

      function isAbortError(err) {
        return err instanceof DOMException && err.name === "AbortError";
      }

      function showError(err) {
        errorBox.textContent = err instanceof Error ? err.message : String(err);
        errorBox.hidden = false;
      }

      function resetPanels() {
        errorBox.hidden = true;
        output.textContent = "";
        output.hidden = true;
        briefingBox.hidden = true;
        briefingBox.textContent = "";
        briefingActions.hidden = true;
        postStatus.textContent = "";
        currentBriefing = null;
      }

      function setBusy(busy) {
        submitButton.disabled = busy;
        briefButton.disabled = busy;
        stopButton.hidden = !busy;
      }

      // Shared by /review and /brief: both stream newline-delimited JSON,
      // one object per log line, so progress shows up live instead of only
      // after the whole request finishes. /brief also sends one
      // {kind: "result"} line carrying the rendered Markdown -- everything
      // else is a progress line for onLine to render.
      async function streamRequest(url, body, onLine, signal) {
        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
          signal,
        });

        if (!response.ok || !response.body) {
          const data = await response.json().catch(() => ({}));
          throw new Error(data.error ?? `Request failed (${response.status})`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        let result = null;

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split("\n");
          buffer = lines.pop() ?? "";
          for (const raw of lines) {
            if (!raw) continue;
            const entry = JSON.parse(raw);
            if (entry.kind === "done") continue;
            if (entry.kind === "error") throw new Error(entry.text);
            if (entry.kind === "result") {
              result = entry.text;
              continue;
            }
            onLine(entry.kind, entry.text);
          }
        }
        return result;
      }

      // Text inside a briefing comes from PR titles, descriptions and
      // comments, so it's never trusted as HTML: everything below is built
      // with textContent, and only the SVG mermaid itself generates is
      // inserted as markup.
      function appendInline(parent, text) {
        text.split("`").forEach((part, i) => {
          if (i % 2 === 1) {
            const code = document.createElement("code");
            code.textContent = part;
            parent.appendChild(code);
          } else {
            parent.appendChild(document.createTextNode(part));
          }
        });
      }

      async function appendDiagram(source) {
        const box = document.createElement("div");
        box.className = "diagram";
        try {
          const { svg } = await mermaid.render("briefing-diagram", source);
          box.innerHTML = svg;
        } catch {
          // The model produced something that isn't valid Mermaid -- show
          // its source instead of silently dropping the diagram.
          const note = document.createElement("p");
          note.textContent = "The diagram couldn't be rendered. Its source:";
          const pre = document.createElement("pre");
          pre.textContent = source;
          box.append(note, pre);
        }
        briefingBox.appendChild(box);
      }

      // Renders the same Markdown the CLI prints, in order: headings,
      // paragraphs, bullets and code blocks, with the mermaid block drawn as
      // a diagram in place. Deliberately a small subset -- this is the shape
      // formatBriefingMarkdown produces, not a general Markdown parser.
      async function renderBriefing(markdown) {
        briefingBox.textContent = "";
        briefingBox.hidden = false;
        const lines = markdown.split("\n");
        let paragraph = [];
        let list = null;

        const flushParagraph = () => {
          if (paragraph.length === 0) return;
          const p = document.createElement("p");
          appendInline(p, paragraph.join(" "));
          briefingBox.appendChild(p);
          paragraph = [];
        };

        for (let i = 0; i < lines.length; i++) {
          const line = lines[i];

          const fence = line.match(/^```(\w*)/);
          if (fence) {
            flushParagraph();
            list = null;
            const body = [];
            i++;
            while (i < lines.length && !lines[i].startsWith("```")) {
              body.push(lines[i]);
              i++;
            }
            if (fence[1] === "mermaid") {
              await appendDiagram(body.join("\n"));
            } else {
              const pre = document.createElement("pre");
              pre.textContent = body.join("\n");
              briefingBox.appendChild(pre);
            }
            continue;
          }

          const heading = line.match(/^(#{1,3}) (.*)/);
          if (heading) {
            flushParagraph();
            list = null;
            // The page already has an h1, so a Markdown # becomes an h2.
            const h = document.createElement(`h${heading[1].length + 1}`);
            appendInline(h, heading[2]);
            briefingBox.appendChild(h);
            continue;
          }

          const bullet = line.match(/^- (.*)/);
          if (bullet) {
            flushParagraph();
            if (!list) {
              list = document.createElement("ul");
              briefingBox.appendChild(list);
            }
            const li = document.createElement("li");
            appendInline(li, bullet[1]);
            list.appendChild(li);
            continue;
          }

          if (line.trim() === "") {
            flushParagraph();
            list = null;
            continue;
          }

          list = null;
          paragraph.push(line.trim());
        }
        flushParagraph();
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        resetPanels();
        setBusy(true);
        submitButton.textContent = "Addressing...";
        const controller = new AbortController();
        activeController = controller;

        try {
          await streamRequest(
            "/review",
            { prUrl: prUrlInput.value, dryRun: dryRunInput.checked },
            appendLine,
            controller.signal,
          );
          // Aborting mid-stream doesn't always reject the pending read (some
          // browsers just resolve it as a clean stream end) -- checking the
          // signal here is what catches that case instead of the request
          // silently looking like it finished normally.
          if (controller.signal.aborted) {
            appendLine("warn", "Stopped.");
          }
        } catch (err) {
          if (isAbortError(err) || controller.signal.aborted) {
            appendLine("warn", "Stopped.");
          } else {
            showError(err);
          }
        } finally {
          setBusy(false);
          submitButton.textContent = "Address review comments";
          activeController = null;
        }
      });

      briefButton.addEventListener("click", async () => {
        resetPanels();
        setBusy(true);
        briefButton.textContent = "Generating...";
        const controller = new AbortController();
        activeController = controller;

        try {
          const markdown = await streamRequest(
            "/brief",
            { prUrl: prUrlInput.value },
            appendLine,
            controller.signal,
          );
          if (controller.signal.aborted) {
            appendLine("warn", "Stopped.");
          } else if (markdown) {
            currentBriefing = markdown;
            briefingActions.hidden = false;
            await renderBriefing(markdown);
          }
        } catch (err) {
          if (isAbortError(err) || controller.signal.aborted) {
            appendLine("warn", "Stopped.");
          } else {
            showError(err);
          }
        } finally {
          setBusy(false);
          briefButton.textContent = "Generate PR Briefing";
          activeController = null;
        }
      });

      stopButton.addEventListener("click", () => {
        activeController?.abort();
      });

      downloadButton.addEventListener("click", () => {
        if (!currentBriefing) return;
        const blob = new Blob([currentBriefing], { type: "text/markdown" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "pr-briefing.md";
        a.click();
        URL.revokeObjectURL(url);
      });

      postButton.addEventListener("click", async () => {
        if (!currentBriefing) return;
        postButton.disabled = true;
        postStatus.textContent = "Posting...";

        try {
          const response = await fetch("/brief/post", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              prUrl: prUrlInput.value,
              markdown: currentBriefing,
            }),
          });
          const data = await response.json();
          if (!response.ok) {
            throw new Error(
              data.error ?? `Request failed (${response.status})`,
            );
          }
          postStatus.textContent = "";
          const link = document.createElement("a");
          link.href = data.url;
          link.target = "_blank";
          link.rel = "noopener";
          link.textContent = data.url;
          postStatus.append("Posted: ", link);
        } catch (err) {
          postStatus.textContent =
            err instanceof Error ? err.message : String(err);
        } finally {
          postButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
